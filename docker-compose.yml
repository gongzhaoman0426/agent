services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-next-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_next
    ports:
      - '5434:5432'
    volumes:
      - agent_next_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent_next_pgdata:
